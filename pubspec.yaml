name: medi_prescribe
description: "MediPrescribe - Digital Prescription Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0
  flutter: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^12.0.0
  
  # UI & Design
  google_fonts: ^6.1.0
  cupertino_icons: 1.0.8
  
  # Date & Time
  intl: ^0.19.0
  
  # Utilities
  uuid: ^4.0.0
  email_validator: ^2.1.17

  # PDF & Printing
  pdf: ^3.10.0
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
